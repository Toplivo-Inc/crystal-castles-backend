version: '3.8'

services:
  db:
    image: postgres:16
    container_name: aspnet_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: YourStrongPass
      POSTGRES_DB: MyAppDb  
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
